<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyRead · PDF 对照实验</title>
<link rel="stylesheet" href="/web/css/base.css"><link rel="stylesheet" href="/web/css/reader.css"><link rel="stylesheet" href="/web/css/reader-panels.css"><link rel="stylesheet" href="/web/css/reader-chat.css"><link rel="stylesheet" href="/web/vendor/katex/katex.min.css"><link rel="stylesheet" href="/web/css/pdf-dual.css">
<script defer src="/web/vendor/katex/katex.min.js"></script><script defer src="/web/js/common/util.js"></script><script defer src="/web/js/common/markup.js"></script><script defer src="/web/js/common/features.js"></script><script defer src="/web/js/pdf-dual/bridge.js"></script><script defer src="/web/js/reflow/outbox.js"></script><script defer src="/web/js/pdf-dual/margin.js"></script><script defer src="/web/js/pdf-dual/notespanel.js"></script><script defer src="/web/js/pdf-dual/chat.js"></script><script defer src="/web/js/pdf-dual/app.js"></script></head>
<body>
<header class="dualbar"><div><a href="/experiments/pdf-dual/" aria-label="返回 PDF 对照实验">←</a> <strong>DoReMi</strong><span class="badge">实验阅读</span></div><div class="actions"><button id="prev">上一页</button><label>页码 <input id="page" type="number" min="1" value="1" aria-label="当前页码"></label><span id="pageCount">/ 21</span><button id="next">下一页</button><label><input id="sync" type="checkbox" checked>同步翻页</label><button id="zoomOut">缩小</button><button id="zoomIn">放大</button><button id="fit">适合页宽</button></div><button id="notesBtn">笔记</button><button id="chatBtn">问 AI</button><span id="saveState" role="status">准备中</span></header>
<div class="sample-notice">原版式 PDF 对照 · 笔记仅存于本实验 · 问 AI 只预览引用，不调用模型</div>
<main id="workspace"><div id="pdfPanes"><section class="pane active" data-side="source"><div class="pane-title"><strong>原文</strong><span id="sourcePage">第 1 页 · v1</span></div><iframe id="sourceFrame" title="原文 PDF"></iframe></section><section class="pane" data-side="translation"><div class="pane-title"><strong>中文译文</strong><span id="translationPage">第 1 页 · v1</span></div><iframe id="translationFrame" title="中文译文 PDF"></iframe></section></div><section id="notespanel" class="side-panel" aria-label="笔记" inert></section><section id="chatpanel" class="side-panel" aria-label="问 AI" inert></section></main>
<div id="selectionTools" role="toolbar" aria-label="选中文字操作" hidden><span id="selectionLabel"></span><button id="copy">复制</button><button id="highlight">划线并写笔记</button><button id="ask">问 AI</button></div>
<div id="status" role="status"></div><button id="retry" hidden>重试保存</button><div id="readerDlg" class="dialog-backdrop"><div class="dialog"></div></div><div id="settingsDlg" hidden></div>
</body></html>
