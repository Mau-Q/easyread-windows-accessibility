<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyRead · 登录</title><link rel="icon" href="/web/favicon.svg"><link rel="stylesheet" href="/web/css/base.css"><link rel="stylesheet" href="/web/css/library.css"><link rel="stylesheet" href="/web/css/account-additions.css"><link rel="stylesheet" href="/web/css/accessibility.css"><script defer src="/web/js/common/accessibility.js"></script></head><body class="library-page"><header class="topbar"><a class="brand" href="/">Easy<b>Read</b></a></header><main class="account-login"><div class="dialog"><h1 id="auth-title">登录文献库</h1><p id="setup-notice" class="hint" hidden></p><label id="setup-choice" class="check" hidden><input type="checkbox" id="accept-original">将现有本机文献和阅读记录归属到首次设置的账号；原文件保留。</label><p class="hint">账号用于隔离各自的论文和记录。本地导入、原文阅读和手动笔记不会自动调用AI。</p><form id="auth-form"><label class="field"><span>用户名</span><input class="input" id="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="3—20位字母、数字或下划线"></label><label class="field"><span>密码</span><input class="input" id="password" type="password" required minlength="8" maxlength="64" autocomplete="current-password" placeholder="8—64位"></label><p id="auth-status" role="status"></p><div class="actions"><button class="btn accent" id="submit">登录</button><button class="btn" type="button" id="toggle">注册账号</button></div></form><p class="hint">账号密码仅在本机处理，密码保存为加盐派生校验值。使用AI前另行说明服务、发送范围和可能费用。</p></div></main><script src="/web/js/common/account-login.js"></script></body></html>
