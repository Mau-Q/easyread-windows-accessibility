<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyRead · PDF 阅读</title>
<link rel="stylesheet" href="/web/css/base.css"><link rel="stylesheet" href="/web/css/reader.css"><link rel="stylesheet" href="/web/css/reader-panels.css"><link rel="stylesheet" href="/web/css/reader-chat.css"><link rel="stylesheet" href="/web/vendor/katex/katex.min.css"><link rel="stylesheet" href="/web/css/pdf-dual.css"><link rel="stylesheet" href="/web/css/reader-theme.css"><link rel="stylesheet" href="/web/css/pdf-reader.css">
<script defer src="/web/vendor/katex/katex.min.js"></script><script defer src="/web/js/common/util.js"></script><script defer src="/web/js/common/selection-preview.js"></script><script defer src="/web/js/common/markup.js"></script><script defer src="/web/js/common/features.js"></script><script defer src="/web/js/pdf-reader/bridge.js"></script><script defer src="/web/js/pdf-reader/outbox.js"></script><script defer src="/web/js/pdf-dual/margin.js"></script><script defer src="/web/js/pdf-dual/notespanel.js"></script><script defer src="/web/js/pdf-dual/chat.js"></script><script defer src="/web/js/common/reader-theme.js"></script><script defer src="/web/js/pdf-reader/appearance.js"></script><script defer src="/web/js/pdf-reader/text-layer.js"></script><script defer src="/web/js/pdf-reader/sync.js"></script><script defer src="/web/js/pdf-reader/selection.js"></script><script defer src="/web/js/pdf-reader/app.js"></script><link rel="stylesheet" href="/web/css/ui-foundation.css"><link rel="stylesheet" href="/web/css/reader-shell.css"><script defer src="/web/js/common/reader-shell.js"></script><script defer src="/web/js/common/reading-history.js"></script><link rel="stylesheet" href="/web/css/reading-history.css"></head>
<body class="pdf-reader reader-shell controls-hidden">
<button id="readingControls" aria-label="显示阅读工具栏" aria-expanded="false" title="显示阅读工具栏">☰</button>
<div class="reader-edge" aria-hidden="true"></div>
<header class="dualbar reader-bar" id="readerBar" aria-label="阅读工具栏" inert>
<a class="btn" href="/">← 文献库</a><strong id="paperTitle" class="reader-title">PDF 阅读</strong>
<span class="reader-mode">PDF 对照</span><div id="pdfLayout" role="group" aria-label="PDF 显示布局"><button data-pdf-layout="source" aria-pressed="false">原文</button><button data-pdf-layout="translation" aria-pressed="false">译文</button><button data-pdf-layout="parallel" aria-pressed="true">并排</button></div><button id="theme" aria-label="阅读背景" aria-expanded="false">外观</button><button id="notesBtn">笔记</button><button id="chatBtn">问 AI</button>
<details class="reader-more"><summary aria-label="更多阅读操作">···</summary><div class="reader-menu">
<strong class="menu-label">页面控制</strong><div class="actions"><button id="prev">上一页</button><label>第 <input id="page" type="number" min="1" value="1" aria-label="当前页码"></label><span id="pageCount"></span><button id="next">下一页</button></div><div class="actions"><label><input id="sync" type="checkbox" checked>同步页码</label><button id="zoomOut">缩小</button><button id="zoomIn">放大</button><button id="fit">适合页宽</button></div>
<select id="translationVersion" aria-label="译文版本" hidden></select>
<div id="nativeTranslationTools"><button id="nativeTranslate" disabled>翻译为中文 PDF</button><button id="nativeCancel" hidden>取消翻译</button><span id="nativeTranslationStatus" role="status"></span></div>
<button id="readingHistory">历史阅读记录</button><span id="saveState" role="status">准备中</span><button id="hideControls" aria-label="收起阅读工具栏">收起工具栏</button>
</div></details></header>
<div class="sample-notice"><span id="readingNotice">原版式 PDF 阅读 · 不自动调用模型</span></div>
<dialog id="nativeTranslationDialog" aria-label="启动幻觉翻译"><h3>用幻觉翻译</h3><p>生成中文 PDF，保持原排版。使用幻觉翻译原生引擎。</p><label>模型连接 <select id="nativeModel"></select></label><p id="nativeTranslationError" role="status"></p><div><button id="nativeDismiss">取消</button><button id="nativeStart">开始翻译</button></div></dialog>
<main id="workspace"><div id="pdfPanes"><section class="pane active" data-side="source"><div class="pane-title"><strong>原文</strong><span id="sourcePage">第 1 页 · v1</span></div><iframe id="sourceFrame" title="原文 PDF"></iframe></section><section class="pane" data-side="translation"><div class="pane-title"><strong>中文译文</strong><span id="translationPage">第 1 页 · v1</span></div><iframe id="translationFrame" title="中文译文 PDF"></iframe><div id="translationPending" hidden><p>尚无译文 PDF，先读原文。</p><p>已有幻觉翻译产物会按原文指纹自动配对。</p><button id="translatePending" disabled>用幻觉翻译</button><button id="findTranslation">重新查找已有译文</button></div></section></div><section id="notespanel" class="side-panel" aria-label="笔记" inert></section><section id="chatpanel" class="side-panel" aria-label="问 AI" inert></section></main>
<div id="selectionTools" role="toolbar" aria-label="选中文字操作" hidden></div>
<div id="status" role="status"></div><button id="retry" hidden>重试保存</button><div id="readerDlg" class="dialog-backdrop"><div class="dialog"></div></div><div id="settingsDlg" hidden></div>
<script src="/web/js/pdf-reader/translation.js" defer></script>
</body></html>
