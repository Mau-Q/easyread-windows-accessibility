<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyRead · PDF 双语阅读</title>
<link rel="stylesheet" href="/web/css/base.css"><link rel="stylesheet" href="/web/css/reader.css"><link rel="stylesheet" href="/web/css/reader-panels.css"><link rel="stylesheet" href="/web/css/reader-chat.css"><link rel="stylesheet" href="/web/css/arxiv-reader.css"><link rel="stylesheet" href="/web/css/reader-theme.css"><link rel="stylesheet" href="/web/css/pdf-web-reader.css"><link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/web/css/settings.css">
<link rel="stylesheet" href="/web/css/selection-translation.css">
<script defer src="/web/vendor/katex/katex.min.js"></script><script defer src="/web/js/common/util.js"></script><script defer src="/web/js/common/markup.js"></script><script defer src="/web/js/common/reader-theme.js"></script><script defer src="/web/js/common/confirm.js"></script><script defer src="/web/js/common/features.js"></script><script defer src="/web/js/reflow/outbox.js"></script><script defer src="/web/js/reflow/panel-bridge.js"></script>
<script defer src="/web/js/reader/margin.js"></script><script defer src="/web/js/reader/notespanel.js"></script><script defer src="/web/js/reader/chat.js"></script><script defer src="/web/js/reader/export.js"></script><script defer src="/web/js/common/settings-models.js"></script><script defer src="/web/js/common/settings.js"></script><script defer src="/web/js/common/settings-tabs.js"></script><script defer src="/web/js/common/settings-chat.js"></script><script defer src="/web/js/common/settings-selection.js"></script><script defer src="/web/js/reader/selection-translation.js"></script><script defer src="/web/js/reflow/app.js"></script></head>
<body>
<header class="webbar"><a class="btn" href="/">← 文献库</a><span class="web-title" id="title">PDF 双语阅读</span><button class="btn" id="reading">切到原 PDF</button><a class="btn" id="original" target="_blank" rel="noopener noreferrer">原 PDF ↗</a><button class="btn" id="jumpAbstract">跳到摘要</button><button class="btn" id="zhToggle">隐藏中文</button><button class="btn" id="translateBtn" aria-expanded="false">翻译</button><button class="btn" id="notesBtn" aria-expanded="false">笔记</button><button class="btn" id="chatBtn" aria-expanded="false">问 AI</button><span class="save-state" id="saveState" role="status"><i></i><span>加载中</span></span><button class="btn" id="theme">阅读配色</button></header>
<div class="web-tools" id="translationTools" hidden><span id="status" role="status">正在准备 PDF…</span><button class="btn" id="continueTranslate">继续翻译</button><button class="btn" id="cancelTranslate">取消任务</button><button class="btn" id="font">字号</button><a class="btn" id="legacy">原阅读模式</a><p id="qualityNotice" hidden role="note"></p></div>
<div id="fallback" hidden></div>
<main id="workspace" class="web-stage" hidden><iframe id="readerFrame" title="论文原文与逐段中文译文"></iframe><section id="notespanel" class="side-panel" aria-label="笔记" inert></section><section id="chatpanel" class="side-panel" aria-label="问 AI" inert></section></main>
<div id="saveStatus" role="status" hidden></div><button class="btn" id="retry" hidden>重试保存</button>
<div class="dialog-backdrop" id="readerDlg"><div class="dialog" role="dialog" aria-label="导出笔记"></div></div><div class="dialog-backdrop" id="settingsDlg"><div class="dialog" role="dialog" aria-label="设置"></div></div><div class="dialog-backdrop" id="textDlg"><div class="dialog wide" role="dialog"></div></div><div id="toast" role="status"></div>
<div id="selectionTools" class="popover" role="toolbar" aria-label="选中文字操作" hidden><div id="quote" hidden></div><span class="muted" id="alignment" hidden></span><button class="btn" id="copy">复制</button><button class="btn" id="highlight">划线</button><button class="btn" id="pdf">回原 PDF</button><button class="btn" id="ask">问 AI</button></div><button class="btn article-jump-back" id="back" hidden>← 返回阅读位置</button>
</body></html>
